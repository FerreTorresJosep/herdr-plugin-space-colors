# herdr-space-colors — plugin configuration
#
# Each workspace gets a palette. Three things follow it:
#   * the Herdr theme (accent + tinted sidebar / active row) — for the focused
#     workspace, since the theme is global
#   * a coloured marker on every agent row and Space row in the sidebar
#   * the pane background, via the shell hook (`herdr-space-colors shell-hook`)
#
# Only the tokens named in a palette are ever written to herdr's config.toml,
# and only those are removed again on `clear`. Everything else is left alone.

# Colour workspaces that match no rule below by hashing their directory onto
# the palettes. Same project → same colour, on every machine, with no setup.
auto = true

# Path to herdr's config.toml. Normally not needed; the default is
# ~/.config/herdr/config.toml, and $HERDR_CONFIG_PATH always wins.
# herdr_config = "~/.config/herdr/config.toml"

[sidebar]
# Write `ui.sidebar.agents.rows` / `ui.sidebar.spaces.rows` with one coloured
# token per palette. Skipped for any row set you have defined yourself.
enabled = true
# What the coloured token shows next to the workspace name (1–8 characters).
marker = "●"

[pane]
# `herdr-space-colors osc` prints an OSC 11 sequence that tints the calling
# pane's background with its palette's `pane_bg` (defaults to `sidebar_bg`).
tint = true

# Explicit assignments — take precedence over `auto`. Match a workspace by its
# exact `label`, or by `path` (a directory prefix, so every worktree of a
# project shares its colour; the longest matching path wins).
#
# [[workspaces]]
# path = "~/projects/api"
# palette = "blue"
#
# [[workspaces]]
# label = "Website"
# palette = "green"

# Pin one agent regardless of its workspace. `session` is the agent session id
# from `herdr agent list` (a pi session may be given by its file name).
# `herdr-space-colors set-agent <pane-id> <palette>` writes these for you.
#
# [[agents]]
# session = "e2792e1e-c279-4618-91be-69c3cfa5b447"
# palette = "yellow"

# Palettes. Keys are theme.custom tokens; values must be #rgb or #rrggbb.
# `pane_bg` (optional) is the pane tint; a `light` sub-table overrides tokens
# when herdr runs a light theme (name contains latte/light/dawn/day/lotus/paper).
# Allowed tokens: accent, panel_bg, sidebar_bg, active_row_bg, selection_bg,
# surface0, surface1, surface_dim, overlay0, overlay1, text, subtext0,
# mauve, green, yellow, red, blue, teal, peach.

[palettes.red]
accent = "#f38ba8"
sidebar_bg = "#2e1f26"
active_row_bg = "#3f2832"
[palettes.red.light]
accent = "#d20f39"
sidebar_bg = "#f2dfe3"
active_row_bg = "#ebcdd3"


name: release

# Build a binary for every supported target on tag push and attach it to the
# GitHub release, so `herdr plugin install` needs no Rust toolchain: the shim
# downloads the matching prebuilt binary when cargo is absent.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Add target
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/herdr-space-colors
          out=herdr-space-colors-${{ matrix.target }}
          cp "$bin" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi
          echo "packaged $out"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            herdr-space-colors-${{ matrix.target }}
            herdr-space-colors-${{ matrix.target }}.sha256
          fail_on_unmatched_files: true

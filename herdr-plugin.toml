id = "ferretorres.space-colors"
name = "Space Colors"
version = "0.3.3"
min_herdr_version = "0.8.2"
description = "Peacock-style per-workspace colours: theme, sidebar rows, panes and the terminal window follow each workspace."
platforms = ["macos", "linux"]

# Provision the binary once at install: build from source when cargo is
# present, otherwise download the prebuilt release binary for this platform.
# The bin/ shim runs the same path, which is what `herdr plugin link` relies on.
[[build]]
command = ["sh", "bin/herdr-space-colors", "--ensure-binary"]

# Re-apply after the server restores its session: theme for the focused
# workspace, sidebar tags for every pane and Space.
[[startup]]
command = ["sh", "bin/herdr-space-colors", "apply"]

# Theme follows focus; herdr applies the theme section live on reload-config.
[[events]]
on = "workspace.focused"
command = ["sh", "bin/herdr-space-colors", "apply"]

# New workspaces and new/changed agents get their sidebar tag without waiting
# for the next focus change. A sweep costs one herdr call per changed entity.
[[events]]
on = "workspace.created"
command = ["sh", "bin/herdr-space-colors", "sweep"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/herdr-space-colors", "sweep"]

[[actions]]
id = "apply"
title = "Apply space colour"
contexts = ["workspace"]
command = ["sh", "bin/herdr-space-colors", "apply"]

[[actions]]
id = "sweep"
title = "Refresh sidebar colour tags"
command = ["sh", "bin/herdr-space-colors", "sweep"]

[[actions]]
id = "clear"
title = "Clear space colours (restore base theme)"
contexts = ["workspace"]
command = ["sh", "bin/herdr-space-colors", "clear"]

[[actions]]
id = "status"
title = "Show space colour assignments"
command = ["sh", "bin/herdr-space-colors", "status"]

[[actions]]
id = "workspace-colour-red"
title = "Colour: Red"
contexts = ["workspace"]
command = ["sh", "bin/herdr-space-colors", "action-colour", "workspace", "red"]

